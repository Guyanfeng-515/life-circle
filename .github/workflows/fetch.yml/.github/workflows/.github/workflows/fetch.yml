name: 生活圈自动抓取

on:
  schedule:
    # 每天 0 点和 12 点（北京时间 = UTC 16:00 / 04:00）
    - cron: '0 16,4 * * *'
  workflow_dispatch: {}   # 支持手动触发一次

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取高德周边数据
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: node fetch_data.mjs

      - name: 提交更新后的 data.json
        run: |
          git config user.name "life-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: 自动抓取更新周边数据 $(date '+%F %T %Z')"
          git push

      - name: 构建 Pages 站点
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.json data.json _site/
          cp -r icons _site/ 2>/dev/null || true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
